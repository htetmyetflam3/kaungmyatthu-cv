# Deploy static content to GitHub Pages — main only.
name: Deploy static content to Pages

on:
  # ONLY pushes to main. Never other branches, never PRs.
  push:
    branches: ["main"]
  # Manual re-run from the Actions tab (available only where this file exists = main)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build only when the Vite sources are present; otherwise ship the
      # committed dist/ as-is (site/ + src/ may live on another branch).
      - name: Setup Node.js
        if: hashFiles('site/**') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: hashFiles('site/**') != ''
        run: npm ci

      - name: Build the site
        if: hashFiles('site/**') != ''
        run: npm run build

      - name: Verify dist exists
        run: test -f dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
